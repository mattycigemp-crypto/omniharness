name: CI

# These two checks (`go`, `npm`) are the required status checks for the protected
# main branch, so a PR cannot merge until both pass. publish.yml runs the
# TypeScript suite again before releasing, but not the Go suite — this workflow
# is the only gate on the Go side.
#
# It also runs on push to main, for two reasons. It restores a Go signal on main
# (publish.yml stopped providing one), and it populates the toolchain and build
# caches. Actions cache scoping only lets a branch restore caches written by its
# base branch, so without a run on main every pull request compiles the whole
# dependency tree from cold — modernc.org/sqlite most of all.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # A hung job otherwise sits until the 6-hour default and burns the runner
    # minutes for it. Both suites finish in about a minute; ten is generous.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          # Caches the module cache and the build cache, keyed on go.sum.
          cache: true
          cache-dependency-path: go.sum
      # gofmt is a hard gate: the formatting is not a matter of taste, and a
      # drifting tree makes every later diff noisier than the change it carries.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -w:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      # The release cross-compiles six targets from one runner. The version is
      # only known after the npm bump, so that build cannot run before the
      # publish — which means a target that fails to compile would strand a
      # published npm version with no binaries. Prove every target builds here,
      # on the pull request, where it costs nothing to fix.
      - name: cross-compile every release target
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" \
              go build -trimpath -o /dev/null ./cmd/omniharness
          done

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
