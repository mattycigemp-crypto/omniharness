name: CI

# These two checks (`go`, `npm`) are the required status checks for the protected
# main branch, so a PR cannot merge until both pass. publish.yml runs the
# TypeScript suite again before releasing, but not the Go suite — this workflow
# is the only gate on the Go side.
#
# It also runs on push to main, for two reasons. It restores a Go signal on main
# (publish.yml stopped providing one), and it populates the toolchain and build
# caches. Actions cache scoping only lets a branch restore caches written by its
# base branch, so without a run on main every pull request compiles the whole
# dependency tree from cold — modernc.org/sqlite most of all.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # A hung job otherwise sits until the 6-hour default and burns the runner
    # minutes for it. Both suites finish in about a minute; ten is generous.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          # Caches the module cache and the build cache, keyed on go.sum.
          cache: true
          cache-dependency-path: go.sum
      # gofmt is a hard gate: the formatting is not a matter of taste, and a
      # drifting tree makes every later diff noisier than the change it carries.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -w:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      # -race, not a plain run. This harness is concurrent by design — parallel
      # agents, a fan-out event bus, a shared budget tracker, a serialised
      # SQLite writer — and the detector is the only thing that finds a data
      # race reliably. It needs cgo, which rules it out on a Windows dev box
      # without gcc, so CI is where it has to run.
      - run: go test -race ./...

  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # macOS and Windows. The two jobs above run on ubuntu only, so until this
  # existed the darwin binaries shipped in every release had never been
  # executed by anyone, and Windows was covered only by whatever a developer
  # happened to run locally. The platform-specific surface here is real:
  # path handling, symlink resolution, process termination and file locking
  # all differ, and this harness touches all four.
  #
  # Deliberately a separate job rather than a matrix over the `go` job above:
  # that job's name is a required status check on main, and turning it into a
  # matrix would rename it to "go (ubuntu-latest)" and silently drop the gate.
  #
  # No -race here — the ubuntu job already runs the detector, and repeating it
  # on a 10x-priced macOS runner buys nothing.
  platforms:
    name: platforms
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: go build ./...
      - run: go test ./...
      - run: npm ci
        working-directory: npm
      - run: npm test
        working-directory: npm
