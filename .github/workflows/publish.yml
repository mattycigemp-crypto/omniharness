name: Publish

# Auto-publish omniharness-cli on every push to main using npm trusted
# publishing (OIDC). No npm token is stored anywhere: the workflow's
# id-token: write permission lets npm mint a short-lived, workflow-scoped
# credential, and npm attaches provenance automatically.
#
# One-time setup (npmjs.com, owner-only):
#   Package settings (omniharness-cli) -> Settings -> Trusted publishing
#   -> GitHub Actions -> user "shipking-ai", repo "omniharness",
#   workflow filename "publish.yml", allowed action "npm publish".
on:
  push:
    branches: [main]
    # A release is a version number people depend on, so only cut one when the
    # shipped artifacts actually change. A README typo, a docs edit, or a
    # landing-page tweak changes nothing a user installs.
    #
    # paths-ignore skips the run only when *every* changed file matches, so a
    # commit touching both a doc and the CLI still releases.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "landing/**"
      - ".github/**"
      - "npm/test/**"
      # Go test files are excluded from the build the same way npm/test is:
      # nothing in a _test.go file reaches a shipped binary. Without this a
      # test-only commit cut a version that installed identical code.
      - "**_test.go"
      - ".gitignore"
      - ".gitattributes"
      - "LICENSE"

  # The escape hatch: cut a release from main by hand when the change is one
  # of the above but you want it published anyway — a corrected README in the
  # npm tarball, say, or re-running a release that failed partway.
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: write # create the release tag and upload the Go binaries

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Release notes are the commits since the previous tag, so the
          # release needs the history and the tags. The default shallow
          # checkout has neither, and would report the entire history as new.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Validate the package entry point before building and publishing.
      - name: Validate npm package metadata
        working-directory: npm
        run: |
          node -e 'const p=require("./package.json"); if (p.bin?.omniharness !== "cli.cjs") throw new Error("npm bin must point to cli.cjs")'
          test -f cli.cjs

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # Resolve the version first, writing nothing. Both channels are then
      # built from this one value, so they cannot disagree about what shipped.
      - name: Resolve the release version
        id: version
        run: echo "version=$(bash scripts/release-npm.sh --print-next-version)" >> "$GITHUB_OUTPUT"

      # Build the binaries before anything is published: a cross-compile that
      # fails stops the release here, rather than leaving a published npm
      # version with no binaries to go with it. Everything is pure Go
      # (modernc.org/sqlite, no CGO), so one runner builds every target — no
      # per-platform matrix.
      - name: Build the Go binaries
        run: bash scripts/build-binaries.sh "${{ steps.version.outputs.version }}" "${GITHUB_SHA::7}"

      # Run the TypeScript suite, build, and publish at the version already
      # used for the binaries. npm detects the OIDC environment and
      # authenticates via trusted publishing without any token.
      - name: Verify and publish to npm
        run: bash scripts/release-npm.sh "${{ steps.version.outputs.version }}"

      # Tag and publish the release last: npm has already succeeded by this
      # point, so a failure here leaves the binaries unattached rather than the
      # two channels disagreeing about what shipped.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$VERSION" > /tmp/notes.md
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md

  # A failed release used to be silent. The steps above are ordered so a
  # failure leaves the two channels agreeing — npm publishes before the tag, so
  # a late failure means binaries are unattached rather than the two disagreeing
  # about what shipped — but somebody still has to know it happened, and nobody
  # watches a green repository.
  #
  # This opens an issue rather than sending mail directly. It needs no SMTP
  # credentials and no secrets beyond the token the workflow already has, it
  # leaves a durable record of which release failed and where, and GitHub's own
  # notification routing turns it into email for whoever is watching the repo.
  notify-failure:
    name: notify on a failed release
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update a release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Release failed on ${SHA:0:7}"
          body=$(printf '%s\n' \
            "The publish workflow failed. Whatever is on npm and on the releases page may" \
            "now disagree with main." \
            "" \
            "- run: $RUN_URL" \
            "- commit: $REPO@${SHA:0:7}" \
            "" \
            "Worth checking in this order, because the steps run in this order:" \
            "" \
            "1. \`npm view omniharness-cli version\` — did npm publish?" \
            "2. \`gh release view\` — is there a tag, and are the six binaries attached?" \
            "3. If npm published and the release did not, the binaries are missing rather" \
            "   than wrong; re-running the workflow from the Actions tab is safe." \
            "" \
            "Opened automatically. Closing it does not fix anything.")
          # One open issue per failure mode rather than one per push: a broken
          # release usually breaks the next few pushes too, and a wall of
          # identical issues is how a notification stops being read.
          existing=$(gh issue list --repo "$REPO" --state open --label release-failure \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" \
              --label release-failure || \
            gh issue create --repo "$REPO" --title "$title" --body "$body"
            echo "opened a new issue"
          fi
