name: Publish

# Auto-publish omniharness-cli on every push to main using npm trusted
# publishing (OIDC). No npm token is stored anywhere: the workflow's
# id-token: write permission lets npm mint a short-lived, workflow-scoped
# credential, and npm attaches provenance automatically.
#
# One-time setup (npmjs.com, owner-only):
#   Package settings (omniharness-cli) -> Settings -> Trusted publishing
#   -> GitHub Actions -> user "shipking-ai", repo "omniharness",
#   workflow filename "publish.yml", allowed action "npm publish".
on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: write # create the release tag and upload the Go binaries

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Release notes are the commits since the previous tag, so the
          # release needs the history and the tags. The default shallow
          # checkout has neither, and would report the entire history as new.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Validate the package entry point before building and publishing.
      - name: Validate npm package metadata
        working-directory: npm
        run: |
          node -e 'const p=require("./package.json"); if (p.bin?.omniharness !== "cli.cjs") throw new Error("npm bin must point to cli.cjs")'
          test -f cli.cjs

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # Resolve the version first, writing nothing. Both channels are then
      # built from this one value, so they cannot disagree about what shipped.
      - name: Resolve the release version
        id: version
        run: echo "version=$(bash scripts/release-npm.sh --print-next-version)" >> "$GITHUB_OUTPUT"

      # Build the binaries before anything is published: a cross-compile that
      # fails stops the release here, rather than leaving a published npm
      # version with no binaries to go with it. Everything is pure Go
      # (modernc.org/sqlite, no CGO), so one runner builds every target — no
      # per-platform matrix.
      - name: Build the Go binaries
        run: bash scripts/build-binaries.sh "${{ steps.version.outputs.version }}" "${GITHUB_SHA::7}"

      # Run the TypeScript suite, build, and publish at the version already
      # used for the binaries. npm detects the OIDC environment and
      # authenticates via trusted publishing without any token.
      - name: Verify and publish to npm
        run: bash scripts/release-npm.sh "${{ steps.version.outputs.version }}"

      # Tag and publish the release last: npm has already succeeded by this
      # point, so a failure here leaves the binaries unattached rather than the
      # two channels disagreeing about what shipped.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$VERSION" > /tmp/notes.md
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --notes-file /tmp/notes.md
