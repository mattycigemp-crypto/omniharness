<svg xmlns="http://www.w3.org/2000/svg" width="840" height="524" viewBox="0 0 840 524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
  <!-- window chrome -->
  <rect x="0.5" y="0.5" width="839" height="523" rx="12" fill="#0e1016" stroke="#262b38"/>
  <path d="M12 0.5 H828 A11.5 11.5 0 0 1 839.5 12 V40 H0.5 V12 A11.5 11.5 0 0 1 12 0.5 Z" fill="#14171f" stroke="#262b38"/>
  <circle cx="24" cy="20.5" r="6" fill="#f2637e"/>
  <circle cx="46" cy="20.5" r="6" fill="#e6b955"/>
  <circle cx="68" cy="20.5" r="6" fill="#8fd66f"/>
  <text x="98" y="25" fill="#8b93a7" letter-spacing="1.5">omniharness</text>

  <!-- footer key row: identical across frames -->
  <text x="28" y="500" fill="#8b93a7" font-size="11.5">Enter send &#183; Ctrl+J newline &#183; Ctrl+O models &#183; Ctrl+E mode &#183; Shift+Tab perms &#183; Ctrl+T tool &#183; Ctrl+Y copy &#183; Ctrl+C quit &#183; /help</text>

  <g transform="translate(28,60)">

    <!-- ================= FRAME 1 — idle, build / manual ================= -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="1;1;0;0;1" keyTimes="0;0.229;0.25;0.979;1"/>
      <rect x="0" y="0" width="560" height="214" rx="8" fill="none" stroke="#2dd4bf"/>
      <text x="18" y="26" fill="#2dd4bf" font-weight="700">&#9671; OMNIHARNESS</text>
      <text x="18" y="45" fill="#8b93a7">the OmniRoute-native agent harness</text>
      <text x="18" y="84"  fill="#c8cdd9"><tspan fill="#8b93a7">gateway  </tspan>http://127.0.0.1:20128</text>
      <text x="18" y="104" fill="#c8cdd9"><tspan fill="#8b93a7">model    </tspan>auto/best-coding</text>
      <text x="18" y="124" fill="#8b93a7">mode     <tspan fill="#8fd66f">build</tspan>  &#183;  Ctrl+E cycles plan &#183; build &#183; research &#183; crazy</text>
      <text x="18" y="144" fill="#8b93a7">perms    <tspan fill="#8b93a7">manual</tspan>  &#183;  Shift+Tab cycles manual &#183; accept edits &#183; bypass</text>
      <text x="18" y="184" fill="#8b93a7">describe the work and press enter &#183; /help for commands</text>

      <rect x="0" y="360" width="784" height="30" rx="7" fill="none" stroke="#8fd66f"/>
      <text x="14" y="380" fill="#8fd66f">&#10095; <tspan fill="#8b93a7">describe the work and press enter</tspan></text>

      <text x="0" y="422" fill="#8b93a7">ready</text>
      <text x="784" y="422" text-anchor="end" fill="#8b93a7"><tspan fill="#8fd66f">build</tspan> &#183; <tspan fill="#8b93a7">&#9675; manual</tspan> &#183; auto/best-coding</text>
    </g>

    <!-- ================= FRAME 2 — Shift+Tab / Ctrl+E: crazy + bypass ================= -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.229;0.25;0.479;0.5;1"/>
      <rect x="0" y="0" width="560" height="214" rx="8" fill="none" stroke="#2dd4bf"/>
      <text x="18" y="26" fill="#2dd4bf" font-weight="700">&#9671; OMNIHARNESS</text>
      <text x="18" y="45" fill="#8b93a7">the OmniRoute-native agent harness</text>
      <text x="18" y="84"  fill="#c8cdd9"><tspan fill="#8b93a7">gateway  </tspan>http://127.0.0.1:20128</text>
      <text x="18" y="104" fill="#c8cdd9"><tspan fill="#8b93a7">model    </tspan>auto/best-coding</text>
      <text x="18" y="124" fill="#8b93a7">mode     <tspan fill="#f2637e" font-weight="700">crazy</tspan>  &#183;  Ctrl+E cycles plan &#183; build &#183; research &#183; crazy</text>
      <text x="18" y="144" fill="#8b93a7">perms    <tspan fill="#f2637e" font-weight="700">bypass</tspan>  &#183;  Shift+Tab cycles manual &#183; accept edits &#183; bypass</text>
      <text x="18" y="184" fill="#8b93a7">describe the work and press enter &#183; /help for commands</text>

      <rect x="0" y="360" width="784" height="30" rx="7" fill="none" stroke="#f2637e"/>
      <text x="14" y="380" fill="#f2637e">&#10095; <tspan fill="#8b93a7">describe the work and press enter</tspan></text>

      <text x="0" y="422" fill="#8b93a7">ready</text>
      <text x="784" y="422" text-anchor="end" fill="#8b93a7"><tspan fill="#f2637e">crazy</tspan> &#183; <tspan fill="#f2637e">&#9679; bypass</tspan> &#183; auto/best-coding</text>
    </g>

    <!-- ================= FRAME 3 — the run: planning ================= -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.479;0.5;0.729;0.75;1"/>
      <text x="0" y="16" fill="#56b6ff" font-weight="700">&#10095; you</text>
      <text x="0" y="36" fill="#c8cdd9">ship the retry-backoff work across the metadata client</text>
      <text x="0" y="66" fill="#2dd4bf" font-weight="700">&#9670; auto/best-coding</text>
      <text x="0" y="86" fill="#c8cdd9">Independent pieces &#8212; fanning the rest out across workers.</text>

      <rect x="0" y="104" width="784" height="94" rx="6" fill="none" stroke="#2dd4bf"/>
      <text x="16" y="126" fill="#2dd4bf" font-weight="700">&#9671; plan</text>
      <text x="768" y="126" text-anchor="end" fill="#8b93a7">1 / 3</text>
      <text x="16" y="148" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> wire the jittered backoff helper</tspan></text>
      <text x="16" y="168" fill="#2dd4bf">&#9672;<tspan fill="#c8cdd9"> cover the 429 + network-drop paths</tspan></text>
      <text x="16" y="188" fill="#8b93a7">&#9675; update the changelog</text>

      <rect x="0" y="360" width="784" height="30" rx="7" fill="none" stroke="#f2637e"/>
      <text x="14" y="380" fill="#f2637e">&#10095; <tspan fill="#8b93a7">type to queue the next task</tspan></text>

      <text x="0" y="422" fill="#f2637e">&#10218;&#10219; working &#183; 3s</text>
      <text x="784" y="422" text-anchor="end" fill="#8b93a7"><tspan fill="#f2637e">crazy</tspan> &#183; <tspan fill="#f2637e">&#9679; bypass</tspan> &#183; auto/best-coding &#183; <tspan fill="#e6b955">ctx &#9608;&#9608;&#9617;&#9617;&#9617;&#9617; 18%</tspan></text>
    </g>

    <!-- ================= FRAME 4 — swarm done ================= -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.729;0.75;0.979;1"/>
      <text x="0" y="16" fill="#2dd4bf" font-weight="700">&#9670; auto/best-coding<tspan fill="#e6b955">  &#183;  via openrouter</tspan></text>
      <text x="0" y="36" fill="#c8cdd9">All three landed. 14 tests green.</text>

      <rect x="0" y="52" width="784" height="94" rx="6" fill="none" stroke="#f2637e"/>
      <text x="16" y="74" fill="#f2637e" font-weight="700">&#9889; swarm</text>
      <text x="768" y="74" text-anchor="end" fill="#8b93a7">3 / 3 lanes done</text>
      <text x="16" y="96"  fill="#2dd4bf">&#10003; A1<tspan fill="#8b93a7">  done: wire the jittered backoff helper</tspan></text>
      <text x="16" y="116" fill="#56b6ff">&#10003; A2<tspan fill="#8b93a7">  done: cover the 429 + network-drop paths</tspan></text>
      <text x="16" y="136" fill="#e6b955">&#10003; A3<tspan fill="#8b93a7">  done: update the changelog</tspan></text>

      <rect x="0" y="160" width="784" height="94" rx="6" fill="none" stroke="#2dd4bf"/>
      <text x="16" y="182" fill="#2dd4bf" font-weight="700">&#9671; plan</text>
      <text x="768" y="182" text-anchor="end" fill="#8b93a7">3 / 3 done</text>
      <text x="16" y="204" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> wire the jittered backoff helper</tspan></text>
      <text x="16" y="224" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> cover the 429 + network-drop paths</tspan></text>
      <text x="16" y="244" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> update the changelog</tspan></text>

      <rect x="0" y="360" width="784" height="30" rx="7" fill="none" stroke="#f2637e"/>
      <text x="14" y="380" fill="#f2637e">&#10095; <tspan fill="#8b93a7">describe the work and press enter</tspan></text>

      <text x="0" y="422" fill="#8b93a7">ready &#183; <tspan fill="#f2637e">swarm 3/3</tspan></text>
      <text x="784" y="422" text-anchor="end" fill="#8b93a7"><tspan fill="#f2637e">crazy</tspan> &#183; <tspan fill="#f2637e">&#9679; bypass</tspan> &#183; auto/best-coding</text>
    </g>
  </g>
</svg>
