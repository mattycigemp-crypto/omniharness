<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <rect x="0.5" y="0.5" width="819" height="439" rx="12" fill="#0e1016" stroke="#262b38"/>
  <path d="M12 0.5 H808 A11.5 11.5 0 0 1 819.5 12 V40 H0.5 V12 A11.5 11.5 0 0 1 12 0.5 Z" fill="#14171f" stroke="#262b38"/>
  <circle cx="24" cy="20.5" r="6" fill="#f2637e"/>
  <circle cx="46" cy="20.5" r="6" fill="#e6b955"/>
  <circle cx="68" cy="20.5" r="6" fill="#8fd66f"/>
  <text x="98" y="25" fill="#8b93a7" letter-spacing="1.5">omniharness</text>

  <g transform="translate(28,64)">
    <text x="0" y="14" fill="#2dd4bf" font-weight="700">&#9671; OMNIHARNESS</text>
    <text x="764" y="14" text-anchor="end" fill="#8b93a7">OMNIROUTE :20128</text>

    <!-- ===== frame 1: typing ===== -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="1;1;0;0;1" keyTimes="0;0.29;0.333;0.958;1"/>
      <text x="0" y="150" fill="#8b93a7">describe the work, pick a mode with Ctrl+E, press enter.</text>
      <rect x="0" y="300" width="740" height="34" rx="8" fill="none" stroke="#8fd66f"/>
      <text x="16" y="322" fill="#8fd66f">&#10095; <tspan fill="#c8cdd9">ship the retry-backoff work across the metadata client</tspan></text>
      <rect x="452" y="311" width="8" height="15" fill="#8fd66f">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="368" fill="#8b93a7">ready</text>
      <text x="764" y="368" text-anchor="end" fill="#8b93a7"><tspan fill="#8fd66f" font-weight="700">build</tspan> &#183; auto/best-coding</text>
    </g>

    <!-- ===== frame 2: planning / streaming ===== -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;1;1;0;0" keyTimes="0;0.29;0.333;0.625;0.667;1"/>
      <text x="0" y="44" fill="#56b6ff" font-weight="700">&#10095; you</text>
      <text x="0" y="66" fill="#c8cdd9">ship the retry-backoff work across the metadata client</text>
      <text x="0" y="100" fill="#2dd4bf" font-weight="700">&#9670; auto/best-coding</text>
      <text x="0" y="122" fill="#c8cdd9">Independent pieces &#8212; fanning the rest out across workers.</text>

      <rect x="0" y="142" width="764" height="92" rx="7" fill="#0f1512" stroke="#22382c"/>
      <rect x="0" y="142" width="3" height="92" fill="#2dd4bf"/>
      <text x="16" y="164" fill="#2dd4bf" font-weight="700">&#9671; plan</text>
      <text x="748" y="164" text-anchor="end" fill="#8b93a7">1 / 3</text>
      <text x="16" y="188" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> wire the jittered backoff helper</tspan></text>
      <text x="16" y="208" fill="#2dd4bf">&#9672;<tspan fill="#c8cdd9"> cover the 429 + network-drop paths</tspan></text>
      <text x="16" y="228" fill="#8b93a7">&#9675; update the changelog</text>

      <rect x="0" y="300" width="740" height="34" rx="8" fill="none" stroke="#8fd66f"/>
      <text x="16" y="322" fill="#8fd66f">&#10095; <tspan fill="#8b93a7">type to queue the next task</tspan></text>
      <text x="0" y="368" fill="#8fd66f">&#9673; planning &#183; 3s</text>
      <text x="764" y="368" text-anchor="end" fill="#8b93a7"><tspan fill="#8fd66f" font-weight="700">build</tspan> &#183; auto/best-coding &#183; <tspan fill="#e6b955">ctx &#9608;&#9608;&#9617;&#9617;&#9617;&#9617; 18%</tspan></text>
    </g>

    <!-- ===== frame 3: swarm done ===== -->
    <g opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
               values="0;0;1;1;0" keyTimes="0;0.625;0.667;0.958;1"/>
      <text x="0" y="44" fill="#2dd4bf" font-weight="700">&#9670; auto/best-coding<tspan fill="#e6b955"> &#183; via openrouter</tspan></text>
      <text x="0" y="66" fill="#c8cdd9">All three landed. 14 tests green.</text>

      <rect x="0" y="86" width="764" height="92" rx="7" fill="#17100f" stroke="#3a2530"/>
      <rect x="0" y="86" width="3" height="92" fill="#f2637e"/>
      <text x="16" y="108" fill="#f2637e" font-weight="700">&#9889; swarm</text>
      <text x="748" y="108" text-anchor="end" fill="#8b93a7">3 / 3 lanes done</text>
      <text x="16" y="132" fill="#2dd4bf">&#10003; A1<tspan fill="#8b93a7">   wire the jittered backoff helper</tspan></text>
      <text x="16" y="152" fill="#56b6ff">&#10003; A2<tspan fill="#8b93a7">   cover the 429 + network-drop paths</tspan></text>
      <text x="16" y="172" fill="#e6b955">&#10003; A3<tspan fill="#8b93a7">   update the changelog</tspan></text>

      <rect x="0" y="194" width="764" height="92" rx="7" fill="#0f1512" stroke="#22382c"/>
      <rect x="0" y="194" width="3" height="92" fill="#2dd4bf"/>
      <text x="16" y="216" fill="#2dd4bf" font-weight="700">&#9671; plan</text>
      <text x="748" y="216" text-anchor="end" fill="#8b93a7">3 / 3 done</text>
      <text x="16" y="240" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> wire the jittered backoff helper</tspan></text>
      <text x="16" y="260" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> cover the 429 + network-drop paths</tspan></text>
      <text x="16" y="280" fill="#8fd66f">&#10003;<tspan fill="#8b93a7"> update the changelog</tspan></text>

      <rect x="0" y="300" width="740" height="34" rx="8" fill="none" stroke="#f2637e"/>
      <text x="16" y="322" fill="#f2637e">&#10095; <tspan fill="#8b93a7">describe the work and press enter</tspan></text>
      <text x="0" y="368" fill="#8b93a7">ready &#183; <tspan fill="#f2637e">swarm 3/3</tspan></text>
      <text x="764" y="368" text-anchor="end" fill="#8b93a7"><tspan fill="#f2637e" font-weight="700">crazy</tspan> &#183; auto/best-coding</text>
    </g>
  </g>
</svg>
